<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>出門喵一下 🐾 v6.0</title>
  <style>
    /* 核心變數與主題設定 */
    :root {
      --bg-color: #FFF9E6;
      --text-main: #5D4037;
      --text-light: #8D6E63;
      --card-bg: rgba(255, 255, 255, 0.85);
      --border-radius: 16px;
      /* 預設女生粉紅主題 */
      --primary-color: #F06292;
      --border-color: #F8BBD0;
      --btn-hover: #E91E63;
    }
    
    [data-theme="male"] {
      --primary-color: #64B5F6;
      --border-color: #BBDEFB;
      --btn-hover: #42A5F5;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Helvetica Neue', Arial, '微軟正黑體', sans-serif;
      overflow: hidden; /* 防止主畫面捲動，確保單頁視圖 */
      position: relative;
      width: 100vw; height: 100vh;
      transition: background-color 0.5s ease;
    }

    /* ====== 1. 真實貓肉球背景動畫 ====== */
    .paw-animation-container {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 0; overflow: hidden;
    }
    .anim-paw {
      position: absolute; width: 40px; height: 40px;
      color: var(--primary-color);
      opacity: 0;
      /* CSS 漸顯漸隱斜向移動動畫 */
      animation: floatPaw 12s infinite linear;
    }
    @keyframes floatPaw {
      0% { transform: translate(0, 100vh) rotate(15deg); opacity: 0; }
      20% { opacity: 0.15; }
      80% { opacity: 0.15; }
      100% { transform: translate(30vw, -10vh) rotate(30deg); opacity: 0; }
    }

    /* ====== 2. 共用控制項與樣式 ====== */
    h1, h2, h3, h4 { margin: 0; font-weight: bold; }
    
    select, input, button {
      width: 100%; padding: 12px; border-radius: 12px;
      border: 2px solid var(--border-color); outline: none;
      font-size: 1.05rem; color: var(--text-main);
      background: #FAFAFA; transition: border-color 0.3s, box-shadow 0.3s;
    }
    select:focus, input:focus { border-color: var(--primary-color); box-shadow: 0 0 5px rgba(0,0,0,0.1); }
    
    button {
      background-color: var(--primary-color); color: white;
      cursor: pointer; border: none; font-size: 1.1rem; padding: 15px;
      transition: filter 0.3s, transform 0.1s;
    }
    button:hover { filter: brightness(1.1); }
    button:active { transform: scale(0.97); }

    .input-row { display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; }
    .input-group { flex: 1; display: flex; flex-direction: column; min-width: 120px; }
    .input-group label { font-size: 0.95rem; font-weight: bold; margin-bottom: 8px; color: var(--primary-color); }

    .alert { padding: 15px; border-radius: 10px; margin-bottom: 15px; font-weight: bold; font-size: 0.95rem; display: none; }
    .error-alert { background-color: #FFEBEE; color: #C62828; display: none; }
    .rain-alert { background-color: #E3F2FD; color: #1565C0; display: none; }
    .temp-alert { background-color: #FFF3E0; color: #E65100; display: none; }

    /* ====== 3. 主畫面 (日常天氣) ====== */
    #main-view {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      z-index: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 40px; /* 增加邊距 */
    }
    
    .weather-card-container {
      width: 100%;
      max-width: 52vw; /* 將 65vw 縮小約 20% */
      min-width: 320px; /* 確保在手機上不會太小 */
    }
    
    .card {
      background: var(--card-bg); backdrop-filter: blur(8px);
      border-radius: 28px; padding: 40px; /* 增加 padding */
      box-shadow: 0 20px 45px rgba(0,0,0,0.15); /* 加深陰影 */
      border: 3px solid rgba(255,255,255,0.6);
      text-align: center;
    }

    /* ====== 4. 紙娃娃氣象喵 (SVG) 與眼神跟隨 ====== */
    .avatar-container {
      position: relative; 
      width: 220px; /* 放大 SVG 容器 */
      height: 220px; 
      margin: 15px auto 30px;
    }
    .cat-svg { width: 100%; height: 100%; overflow: visible; }
    .avatar-layer { opacity: 0; transition: opacity 0.4s ease, transform 0.4s ease; transform: scale(0.9); }
    .avatar-layer.active { opacity: 1; transform: scale(1); }
    
    .eye { transform-origin: center; } 

    /* ====== 5. 側滑面板 (打包顧問) ====== */
    #drawer-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5); z-index: 90;
      opacity: 0; pointer-events: none; transition: opacity 0.4s ease;
    }
    #drawer-overlay.active { opacity: 1; pointer-events: auto; }

    #side-drawer {
      position: fixed; top: 0; left: 0;
      width: 100%; max-width: 1000px;
      height: 100%;
      background: #FAFAFA; z-index: 100;
      box-shadow: 5px 0 25px rgba(0,0,0,0.2);
      transform: translateX(-100%); /* 使用 transform 隱藏，解決寫死負值導致看不到把手的問題 */
      transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
      display: flex; flex-direction: column;
    }
    #side-drawer.open { transform: translateX(0); }

    .drawer-handle {
      position: absolute; right: -48px; top: 60px;
      width: 48px; height: 150px;
      background: var(--primary-color); color: white;
      border-radius: 0 16px 16px 0; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      writing-mode: vertical-lr; font-weight: bold; letter-spacing: 4px; font-size: 1.2rem;
      box-shadow: 4px 0 10px rgba(0,0,0,0.1); transition: background-color 0.3s;
    }
    
    .drawer-header {
      padding: 25px; background: var(--primary-color); color: white;
      display: flex; justify-content: space-between; align-items: center;
    }
    .close-btn {
      background: none; border: none; font-size: 1.8rem; color: white;
      width: auto; padding: 0; cursor: pointer;
    }

    .drawer-content { padding: 25px; overflow-y: auto; flex-grow: 1; }

    /* ====== 6. 遊戲化打包清單 ====== */
    .progress-wrapper { margin: 20px 0; }
    .progress-text { font-size: 0.95rem; font-weight: bold; color: var(--primary-color); margin-bottom: 8px; text-align: right; }
    .progress-container { width: 100%; height: 14px; background: #E0E0E0; border-radius: 7px; overflow: hidden; }
    .progress-bar { height: 100%; width: 0%; background: var(--primary-color); transition: width 0.4s cubic-bezier(0.25, 0.8, 0.25, 1); }

    .compact-list {
      display: grid; grid-template-columns: repeat(4, 1fr); /* 放寬後將格子增加到 4 欄 */
      gap: 15px; /* 增加間距 */
      list-style: none; margin: 15px 0 25px 0;
    }
    .packing-item {
      background: white; padding: 12px; border-radius: 14px;
      display: flex; align-items: center; gap: 10px; cursor: pointer;
      border: 2px solid var(--border-color);
      transition: all 0.2s; user-select: none;
    }
    .packing-item.checked { background: var(--bg-color); opacity: 0.6; border-color: transparent; }
    .packing-item.checked .item-text { text-decoration: line-through; color: #9E9E9E; }
    .packing-item input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--primary-color); cursor: pointer; pointer-events: none; }
    .item-icon { width: 38px; height: 38px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 20px; flex-shrink: 0; }
    .item-text { font-size: 0.9rem; line-height: 1.4; }
    .item-text b { font-size: 1.1rem; color: var(--primary-color); }

    #celebration {
      display: none; text-align: center; color: var(--primary-color); font-weight: bold; font-size: 1.2rem;
      padding: 15px; background: var(--bg-color); border-radius: 12px; border: 2px dashed var(--primary-color);
      animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes popIn { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

    /* ====== 7. 迎賓 Modal ====== */
    #onboarding-modal {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(255, 249, 230, 0.9); backdrop-filter: blur(8px);
      display: flex; justify-content: center; align-items: center; z-index: 1000;
    }
    .modal-content {
      background: white; padding: 40px; border-radius: 24px; width: 90%; max-width: 450px;
      text-align: center; box-shadow: 0 15px 50px rgba(0,0,0,0.15); border: 4px solid var(--primary-color);
    }
  </style>
</head>
<body data-theme="female">

      <div class="input-group" style="margin-bottom: 20px; text-align: left;">
        <label>🌍 我現在的座標在...</label>
        <select id="onboard-location"><option value="" disabled selected>請選擇縣市</option></select>
      </div>
      <div class="input-group" style="margin-bottom: 25px; text-align: left;">
        <label>🙋 我是...</label>
        <select id="onboard-gender">

  </div>

  <!-- 3. 主畫面 (日常天氣) -->
  <div id="main-view">
    <div class="weather-card-container" id="cardContainer">
      <div class="card" id="mainCard">
        <h1 style="font-size: 2.2rem; color: var(--primary-color); margin-bottom: 8px;">出門喵一下 🐾</h1>

        <div id="daily-error" class="alert error-alert">

        </div>

        <div id="daily-content">
          <!-- 互動紙娃娃 SVG -->
          <div class="avatar-container">
            <svg class="cat-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
              <!-- 基本身體 -->
              <circle cx="100" cy="115" r="55" fill="#FFCC80"/>
              <!-- 耳朵 -->

              <g class="eye" id="eyeRight"><circle cx="125" cy="95" r="6" fill="#5D4037"/></g>
              
              <!-- 鼻子與嘴巴 -->
              <polygon points="96,112 104,112 100,116" fill="#F06292"/>
              <path d="M 92,122 Q 100,130 108,122" stroke="#5D4037" stroke-width="2" fill="none" stroke-linecap="round"/>
              
              <!-- ==== 動態衣物圖層 ==== -->
              <!-- 1. 墨鏡 (炎熱) -->

          </div>

          <div style="display:flex; align-items:center; justify-content:center; gap: 20px; margin-bottom: 15px;">
            <h2 id="daily-temp" style="font-size: 3.5rem; color: var(--primary-color);">--°C</h2>
            <p id="daily-desc" style="font-size: 1.3rem; color: var(--text-light);">載入中...</p>
          </div>
          
          <!-- 警報區塊 -->
          <div id="daily-rain-alert" class="alert rain-alert"></div>
          <div id="daily-temp-alert" class="alert temp-alert"></div>

          <div style="background: rgba(255,255,255,0.7); border-radius: 16px; padding: 20px; border: 1px solid var(--border-color);">

      </div>
    </div>
  </div>

  <!-- 4. 側滑面板遮罩 -->
  <div id="drawer-overlay" onclick="toggleDrawer()"></div>

  <!-- 5. 側滑抽屜 (打包顧問) -->
  <div id="side-drawer">
    <!-- 側滑把手 -->
    <div class="drawer-handle" onclick="toggleDrawer()">🧳 打包顧問</div>
    
    <div class="drawer-header">
      <h2 style="font-size: 1.4rem;">🧳 喵星人旅遊打包顧問</h2>
      <button class="close-btn" onclick="toggleDrawer()">✖</button>
    </div>
    
    <div class="drawer-content">
      <div class="input-row">
        <div class="input-group">
          <label>🌍 目的地</label>
          <select id="travel-location" onchange="fetchTravelWeather()"></select>
        </div>
        <div class="input-group">
          <label>📅 出發日</label>
          <input type="date" id="travel-date" onchange="updateTravelDaysLimit(); fetchTravelWeather()">
        </div>
        <div class="input-group" style="min-width: 80px;">
          <label>🎒 天數</label>
          <select id="travel-days" onchange="fetchTravelWeather()"></select>
        </div>
      </div>
      
      <button onclick="fetchTravelWeather()">✨ 產出專屬打包清單</button>

      <div id="travel-error" class="alert error-alert" style="margin-top: 20px;">
        🛑 喵嗚，無法取得氣象資料！<button onclick="fetchTravelWeather()" style="width:auto; padding:8px; margin-top:10px; font-size:0.95rem;">🔄 重試</button>
      </div>

      <div id="travel-result" style="display: none; margin-top: 20px;">
        <p id="travel-intro" style="font-weight:bold; color: var(--text-light); font-size: 0.95rem; margin: 0 0 15px 0; background: #FFF9E6; padding: 12px; border-radius: 10px; border: 1px solid var(--border-color);"></p>

            <div id="packing-progress" class="progress-bar"></div>
          </div>
        </div>

        <!-- 互動核對表 -->
        <ul id="packing-list" class="compact-list"></ul>
        
        <!-- 溫度趨勢圖 (新增) -->
        <div id="weather-chart-container" style="display: none; margin-top: 20px; width: 100%;"></div>

        <!-- 慶祝訊息 -->
        <div id="celebration" style="margin-top: 20px;">🎉 行李箱塞滿啦！出發喵！ ✈️</div>
      </div>
    </div>
  </div>

  <script>
    /* ==========================================
       資料字典與工具函式
       ========================================== */
    const locationData = {
      "臺北市": {lat:25.03, lon:121.56}, "新北市": {lat:25.01, lon:121.46}, "基隆市": {lat:25.12, lon:121.74},
      "桃園市": {lat:24.99, lon:121.30}, "新竹市": {lat:24.81, lon:120.96}, "新竹縣": {lat:24.82, lon:121.01},
      "苗栗縣": {lat:24.56, lon:120.82}, "臺中市": {lat:24.14, lon:120.68}, "彰化縣": {lat:24.07, lon:120.54},
      "南投縣": {lat:23.90, lon:120.69}, "雲林縣": {lat:23.70, lon:120.54}, "嘉義市": {lat:23.48, lon:120.44},
      "嘉義縣": {lat:23.45, lon:120.25}, "臺南市": {lat:23.00, lon:120.22}, "高雄市": {lat:22.62, lon:120.31},
      "屏東縣": {lat:22.66, lon:120.48}, "宜蘭縣": {lat:24.75, lon:121.75}, "花蓮縣": {lat:23.98, lon:121.60},
      "臺東縣": {lat:22.75, lon:121.14}, "澎湖縣": {lat:23.57, lon:119.58}, "金門縣": {lat:24.43, lon:118.31},
      "連江縣": {lat:26.15, lon:119.95}
    };

    const wmoCodes = {
      0: "晴天 ☀️", 1: "晴時多雲 🌤️", 2: "多雲 ⛅", 3: "陰天 ☁️",
      45: "霧 🌫️", 48: "霧 🌫️", 51: "毛毛雨 🌧️", 53: "毛毛雨 🌧️", 55: "毛毛雨 🌧️",
      61: "陣雨 🌧️", 63: "雨天 🌧️", 65: "大雨 🌧️", 71: "下雪 ❄️", 80: "陣雨 🌧️", 95: "雷雨 ⛈️", 99: "大雷雨 ⛈️"
    };

    // 取得修正時區後的 YYYY-MM-DD
    function getLocalDateString(dateObj) {
      const tzOffset = dateObj.getTimezoneOffset() * 60000;
      return (new Date(dateObj.getTime() - tzOffset)).toISOString().split('T')[0];
    }
    const todayStr = getLocalDateString(new Date());

    /* ==========================================
       初始化邏輯 (Initial Load)
       ========================================== */
    function initApp() {
      generatePawBackground();
      populateDropdowns();
      
      initDateConstraints();
      updateDynamicGreeting();
      initEyeTracking();

      const loc = localStorage.getItem('meow_location');
      const gen = localStorage.getItem('meow_gender');

      if (!loc || !gen) {
        document.getElementById('onboarding-modal').style.display = 'flex';
      } else {
        document.getElementById('daily-location').value = loc;
        document.getElementById('travel-location').value = loc;
        document.getElementById('daily-gender').value = gen;
        applyTheme(gen);
        fetchDailyWeather();
      }
    }

    // 1. 生成真實肉球背景動畫

    // 2. 載入縣市選項
    function populateDropdowns() {
      const locs = Object.keys(locationData);
      const targets = ['onboard-location', 'daily-location', 'travel-location'];
      targets.forEach(id => {
        const select = document.getElementById(id);
        locs.forEach(l => select.appendChild(new Option(l, l)));
      });
    }

    // 3. 動態問候語
    function updateDynamicGreeting() {
      const hour = new Date().getHours();
      let greet = "";
      if (hour >= 6 && hour < 12) greet = "早安喵！出門前讓本喵確認裝備 ☀️";
      else if (hour >= 12 && hour < 18) greet = "午安喵！下午也要有精神喔 🐾";
      else if (hour >= 18 && hour < 24) greet = "晚安喵！晚上出門記得注意安全 🌙";
      else greet = "夜貓子喵！這麼晚還不快去睡覺？ 🦉";
      document.getElementById('greetingText').innerText = greet;
    }

    // 4. 動態約束打包日期與天數
    function initDateConstraints() {
      const maxDate = new Date();
      maxDate.setDate(maxDate.getDate() + 14); 
      
      const dateInput = document.getElementById('travel-date');
      dateInput.min = todayStr;
      dateInput.max = getLocalDateString(maxDate);
      dateInput.value = todayStr;
      updateTravelDaysLimit();
    }

    function updateTravelDaysLimit() {
      const dateInput = document.getElementById('travel-date').value;
      const daysSelect = document.getElementById('travel-days');
      if(!dateInput) return;
      
      const selectedDate = new Date(dateInput);
      const todayDate = new Date(todayStr);
      const diffDays = Math.ceil(Math.abs(selectedDate - todayDate) / (1000 * 60 * 60 * 24));
      
      let maxDays = 15 - diffDays;
      if (maxDays < 1) maxDays = 1;
      
      const currentVal = parseInt(daysSelect.value) || 1;
      daysSelect.innerHTML = '';
      for(let i = 1; i <= maxDays; i++) {
        daysSelect.appendChild(new Option(`${i} 天`, i));
      }
      daysSelect.value = (currentVal > maxDays) ? maxDays : currentVal;
    }

    /* ==========================================
       狀態異動與主題 (State & Theming)
       ========================================== */
    function applyTheme(gender) {
      document.body.setAttribute('data-theme', gender);
    }

    function saveOnboarding() {
      const loc = document.getElementById('onboard-location').value;
      const gen = document.getElementById('onboard-gender').value;
      if (!loc || !gen) {
        alert("喵嗚～請先選擇所在地和性別喔！🐾");
        return;
      }
      localStorage.setItem('meow_location', loc);
      localStorage.setItem('meow_gender', gen);
      document.getElementById('onboarding-modal').style.display = 'none';
      
      document.getElementById('daily-location').value = loc;
      document.getElementById('travel-location').value = loc;
      document.getElementById('daily-gender').value = gen;
      applyTheme(gen);
      fetchDailyWeather();
    }

    function updateDailySettings() {
      const loc = document.getElementById('daily-location').value;
      const gen = document.getElementById('daily-gender').value;
      localStorage.setItem('meow_location', loc);
      localStorage.setItem('meow_gender', gen);

    /* ==========================================
       視覺與互動特效 (UI/UX Animations)
       ========================================== */
    function toggleDrawer() {
      document.getElementById('side-drawer').classList.toggle('open');
      document.getElementById('drawer-overlay').classList.toggle('active');
    }

    function initEyeTracking() {
      const eyes = [document.getElementById('eyeLeft'), document.getElementById('eyeRight')];

      document.addEventListener('mousemove', (e) => {
        // 貓眼珠跟隨
        eyes.forEach(eye => {
          if(!eye) return;
          const eyeRect = eye.getBoundingClientRect();
          const eyeCx = eyeRect.left + eyeRect.width / 2;
          const eyeCy = eyeRect.top + eyeRect.height / 2;
          
          const angle = Math.atan2(e.clientY - eyeCy, e.clientX - eyeCx);
          const distance = 4; // 眼珠移動半徑
          const x = Math.cos(angle) * distance;
          const y = Math.sin(angle) * distance;
          eye.style.transform = `translate(${x}px, ${y}px)`;
        });
      });
    }

    /* ==========================================
       API 呼叫與業務邏輯
       ========================================== */
    function buildApiUrl(lat, lon, days) {
        return `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=weathercode,apparent_temperature_max,apparent_temperature_min&timezone=Asia%2FTaipei&forecast_days=${days}`;
    }

    // 模組 B: 日常天氣與紙娃娃連動
    async function fetchDailyWeather() {
      const errorAlert = document.getElementById('daily-error');
      const contentArea = document.getElementById('daily-content');
      errorAlert.style.display = 'none';
      contentArea.style.display = 'block';
      
      document.getElementById('daily-temp').innerText = "🐾";
      document.getElementById('daily-desc').innerText = "觀測中...";
      
      // 隱藏所有紙娃娃配件
      document.querySelectorAll('.avatar-layer').forEach(layer => layer.classList.remove('active'));

      const loc = document.getElementById('daily-location').value;
      const gen = document.getElementById('daily-gender').value;
      const coords = locationData[loc];
      
      try {
        const res = await fetch(buildApiUrl(coords.lat, coords.lon, 1));
        if(!res.ok) throw new Error("API Fetch Error");
        const data = await res.json();
        
        const maxTemp = Math.round(data.daily.apparent_temperature_max[0]);
        const minTemp = Math.round(data.daily.apparent_temperature_min[0]);
        const avgTemp = (maxTemp + minTemp) / 2;
        const code = data.daily.weathercode[0];
        const diff = maxTemp - minTemp;
        
        document.getElementById('daily-temp').innerText = `${minTemp}° ~ ${maxTemp}°C`;
        document.getElementById('daily-desc').innerText = wmoCodes[code] || "未知天氣";
        
        // 處理警報
        const rainAlert = document.getElementById('daily-rain-alert');
        const tempAlert = document.getElementById('daily-temp-alert');
        
        if (code >= 51) {
          rainAlert.innerText = "☔ 降雨機率高，請攜帶折疊傘！";
          rainAlert.style.display = 'block';
          document.getElementById('layer-umbrella').classList.add('active'); // 紙娃娃撐傘
        } else {
          rainAlert.style.display = 'none';
        }
        
        if (diff >= 8) {
          tempAlert.innerText = "🧅 溫差達 8 度以上，建議洋蔥式穿脫！";
          tempAlert.style.display = 'block';
        } else {
          tempAlert.style.display = 'none';
        }
        
        // 紙娃娃衣物圖層與文案邏輯
        let outfitMsg = "";
        if (avgTemp >= 28) {
          document.getElementById('layer-sunglasses').classList.add('active');
          outfitMsg = gen === 'male' ? "短袖與短褲透氣，出門記得多喝水喔！" : "短袖或無袖，配涼爽短裙/短褲，記得防曬！";
        } else if (avgTemp >= 23) {
          // 舒適無配件
          outfitMsg = gen === 'male' ? "短袖或薄長袖配休閒長褲，輕鬆出門！" : "薄長袖或雪紡衫搭長裙/寬褲，美美出門！";
        } else if (avgTemp >= 17) {
          document.getElementById('layer-thin-scarf').classList.add('active');
          outfitMsg = gen === 'male' ? "薄長袖和長褲，記得帶件夾克或薄風衣！" : "長袖針織衫和中長裙/長褲，帶件針織小外套！";
        } else {
          document.getElementById('layer-cold').classList.add('active'); // 毛帽與厚圍巾
          outfitMsg = gen === 'male' ? "發熱衣、厚毛衣和保暖褲，加厚羽絨外套！" : "發熱衣、厚毛衣和保暖褲襪，加羽絨大衣！";
        }
        
        document.getElementById('daily-outfit').innerText = outfitMsg;
        updateDynamicGreeting();
        
      } catch (err) {
        contentArea.style.display = 'none';
        errorAlert.style.display = 'block';
      }
    }

    // 模組 C: 旅遊打包顧問
    async function fetchTravelWeather() {
      const errorAlert = document.getElementById('travel-error');
      const resultDiv = document.getElementById('travel-result');
      errorAlert.style.display = 'none';
      resultDiv.style.display = 'none';
      
      const loc = document.getElementById('travel-location').value;
      const startDateStr = document.getElementById('travel-date').value;
      const days = parseInt(document.getElementById('travel-days').value);
      const gender = localStorage.getItem('meow_gender') || 'female';
      
      if(!loc || !startDateStr || !days) return;
      
      const coords = locationData[loc];
      const submitBtn = document.querySelector('#side-drawer button');
      const originalText = submitBtn.innerText;
      submitBtn.innerText = "🐾 貓草計算中...";
      
      try {
        const res = await fetch(buildApiUrl(coords.lat, coords.lon, 16));
        if(!res.ok) throw new Error("API Fetch Error");
        const data = await res.json();
        
        const startIndex = data.daily.time.indexOf(startDateStr);
        if (startIndex === -1) throw new Error("超出預測範圍");
        
        // 統計變數
        let hotDays = 0, coldDays = 0;
        let hasRain = false, maxDiff = 0, extremeMin = 100, extremeMax = -100;
        
        for (let i = 0; i < days; i++) {
          const idx = startIndex + i;
          if (idx >= data.daily.time.length) break;
          
          const maxT = Math.round(data.daily.apparent_temperature_max[idx]);
          const minT = Math.round(data.daily.apparent_temperature_min[idx]);
          const avgT = (maxT + minT) / 2;
          const code = data.daily.weathercode[idx];
          const diff = maxT - minT;
          
          if (avgT >= 24) hotDays++; else coldDays++;
          if (code >= 51) hasRain = true;
          if (diff > maxDiff) maxDiff = diff;
          if (minT < extremeMin) extremeMin = minT;
          if (maxT > extremeMax) extremeMax = maxT;
        }
        
        generatePackingList(days, hotDays, coldDays, hasRain, maxDiff, extremeMin, extremeMax, gender);
        if (days >= 2) {
          generateWeatherChart(days, data, startIndex);
        } else {
          document.getElementById('weather-chart-container').style.display = 'none';
        }
        
        resultDiv.style.display = 'block';
        
      } catch (err) {
        errorAlert.style.display = 'block';
      } finally {
        submitBtn.innerText = originalText;
      }
    }

    // 溫度趨勢圖產生器 (新增)
    function generateWeatherChart(days, data, startIndex) {
      const container = document.getElementById('weather-chart-container');
      
      let chartData = [];
      let globalMax = -100, globalMin = 100;
      for(let i = 0; i < days; i++) {
        const idx = startIndex + i;
        const maxT = Math.round(data.daily.apparent_temperature_max[idx]);
        const minT = Math.round(data.daily.apparent_temperature_min[idx]);
        const avgT = (maxT + minT) / 2;
        const code = data.daily.weathercode[idx];
        const dateStr = data.daily.time[idx].substring(5); // MM-DD
        chartData.push({ maxT, minT, avgT, code, dateStr });
        if(maxT > globalMax) globalMax = maxT;
        if(minT < globalMin) globalMin = minT;
      }

      // 取得側邊欄寬度作為基準
      const drawerWidth = document.getElementById('side-drawer').clientWidth;
      // 自適應寬度，如果天數很多就允許出現水平捲軸
      const svgWidth = Math.max(drawerWidth - 60, days * 75); 
      const svgHeight = 250;
      const paddingTop = 45;
      const paddingBottom = 35;
      const usableHeight = svgHeight - paddingTop - paddingBottom;
      
      let yRange = globalMax - globalMin;
      if (yRange === 0) yRange = 1; // 避免除以零
      const segmentWidth = svgWidth / days;

      let svgHtml = `<div style="width: 100%; overflow-x: auto; border-radius: 12px; border: 2px solid var(--border-color); background: white;"><svg width="${svgWidth}" height="${svgHeight}" viewBox="0 0 ${svgWidth} ${svgHeight}" xmlns="http://www.w3.org/2000/svg" style="display: block;">`;

      // 1. 畫背景色塊、虛線與 X軸標籤
      for(let i = 0; i < days; i++) {
        const d = chartData[i];
        const xStart = i * segmentWidth;
        const xCenter = xStart + segmentWidth / 2;

        // 溫度區間底色邏輯 (與打包邏輯相對應)
        let bgColor = "#FFF9C4"; 
        if(d.avgT >= 28) bgColor = "#FFEBEE"; // 極熱 (粉紅)
        else if(d.avgT >= 24) bgColor = "#FFF3E0"; // 熱 (橘黃)
        else if(d.avgT >= 17) bgColor = "#E8F5E9"; // 舒適 (淺綠)
        else bgColor = "#E3F2FD"; // 寒冷 (淺藍)

        svgHtml += `<rect x="${xStart}" y="0" width="${segmentWidth}" height="${svgHeight}" fill="${bgColor}" opacity="0.6"/>`;

        // 天與天之間的虛直線 (第一天前面不畫)
        if(i > 0) {
          svgHtml += `<line x1="${xStart}" y1="0" x2="${xStart}" y2="${svgHeight}" stroke="#BCAAA4" stroke-width="1.5" stroke-dasharray="5,5" opacity="0.7" />`;
        }

        // X軸日期文字
        svgHtml += `<text x="${xCenter}" y="${svgHeight - 12}" font-size="13" fill="#5D4037" text-anchor="middle" font-weight="bold">${d.dateStr}</text>`;

        // 當日晴雨圖示 (從 wmoCodes 提取 Emoji)
        const icon = wmoCodes[d.code] ? wmoCodes[d.code].split(' ')[1] : '🌤️';
        svgHtml += `<text x="${xCenter}" y="28" font-size="22" text-anchor="middle">${icon}</text>`;
      }

      // 取得 Y 座標的映射函數
      const getY = (t) => paddingTop + usableHeight - ((t - globalMin) / yRange) * usableHeight;

      // 2. 畫折線 (最低溫 - 藍色)
      let minPoints = chartData.map((d, i) => `${(i + 0.5) * segmentWidth},${getY(d.minT)}`).join(' ');
      svgHtml += `<polyline points="${minPoints}" fill="none" stroke="#42A5F5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />`;

      // 3. 畫折線 (最高溫 - 紅色)
      let maxPoints = chartData.map((d, i) => `${(i + 0.5) * segmentWidth},${getY(d.maxT)}`).join(' ');
      svgHtml += `<polyline points="${maxPoints}" fill="none" stroke="#EF5350" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />`;

      // 4. 畫每個節點與數值標籤
      for(let i = 0; i < days; i++) {
        const d = chartData[i];
        const xCenter = (i + 0.5) * segmentWidth;
        const minY = getY(d.minT);
        const maxY = getY(d.maxT);

        // 最低溫圓點與文字
        svgHtml += `<circle cx="${xCenter}" cy="${minY}" r="4.5" fill="#FFFFFF" stroke="#42A5F5" stroke-width="2.5" />`;
        svgHtml += `<text x="${xCenter}" y="${minY + 22}" font-size="13" fill="#1565C0" text-anchor="middle" font-weight="bold">${d.minT}°</text>`;

        // 最高溫圓點與文字
        svgHtml += `<circle cx="${xCenter}" cy="${maxY}" r="4.5" fill="#FFFFFF" stroke="#EF5350" stroke-width="2.5" />`;
        svgHtml += `<text x="${xCenter}" y="${maxY - 14}" font-size="13" fill="#C62828" text-anchor="middle" font-weight="bold">${d.maxT}°</text>`;
      }

      svgHtml += `</svg></div>`;
      
      container.innerHTML = `<h3 style="font-size:1.1rem; color:var(--primary-color); margin-bottom:10px;">📈 氣溫變化與天氣預測</h3>` + svgHtml;
      container.style.display = 'block';
    }

    // 遊戲化打包清單產生器
    function generatePackingList(days, hotDays, coldDays, hasRain, maxDiff, extremeMin, extremeMax, gender) {
      const isMale = (gender === 'male');
      
      // 精算公式
      let tShirt = hotDays;
      let longShirt = coldDays;
      if (hotDays >= coldDays) tShirt++; else longShirt++;
      
      let pants = Math.ceil(days / 2);
      let shorts = 0;
      if (extremeMax > 28) {
        shorts = (days >= 4) ? 2 : 1; 
        pants = Math.max(1, pants - shorts);
      }
      
      let thickCoat = (extremeMin <= 16) ? 1 : 0;
      let thinCoat = (maxDiff >= 8 || (16 < extremeMin && extremeMin <= 23)) ? 1 : 0;
      const underwear = days + 1;
      const pj = (days <= 3) ? 1 : 2;
      
      // 動態文案
      let intro = "";
      if (hotDays === days) intro = "天氣熱☀️ 準備短袖為主！";
      else if (coldDays === days) intro = "冷颼颼🥶 保暖長袖不能少！";
      else intro = "氣溫多變🌡️ 混搭長短袖隨時替換！";
      if (maxDiff >= 8) intro += " 溫差大，記得洋蔥穿脫🧅。";
      if (hasRain) intro += " 會下雨☔ 折疊傘別忘記！";
      else intro += " 沒下雨好幸運，安心出發🕶️。";
      
      document.getElementById('travel-intro').innerText = intro;
      
      // 產生 Checkbox 清單
      const ul = document.getElementById('packing-list');
      let html = "";
      
      let idCounter = 0;
      const addItem = (icon, bgColor, text, count) => {
        idCounter++;
        html += `
          <label class="packing-item">
            <input type="checkbox" id="chk-${idCounter}" onchange="updateProgressBar()">
            <div class="item-icon" style="background-color: ${bgColor};">${icon}</div>
            <div class="item-text">${text}<br><b>${count}</b></div>
          </label>
        `;
      };
      
      addItem('👕', '#E3F2FD', '短袖上衣', `${tShirt} 件`);
      addItem('👔', '#FFF3E0', '長袖上衣 (含備用)', `${longShirt} 件`);
      
      if(isMale) {
        addItem('👖', '#E8F5E9', '休閒長褲', `${pants} 件`);
        if (shorts > 0) addItem('🩳', '#FCE4EC', '透氣短褲', `${shorts} 件`);
      } else {
        addItem('👖', '#E8F5E9', '長褲 / 長裙', `${pants} 件`);
        if (shorts > 0) addItem('👗', '#FCE4EC', '短褲 / 短裙', `${shorts} 件`);
      }
      
      if (thickCoat > 0) addItem('🧥', '#F3E5F5', '厚羽絨外套', `${thickCoat} 件`);
      if (thinCoat > 0) addItem('🧥', '#FFF9C4', '薄外套/罩衫', `${thinCoat} 件`);
      
      addItem('🧦', '#EFEBE9', '內外衣與襪', `${underwear} 套`);
      addItem('🌙', '#E0F7FA', '舒適睡衣', `${pj} 套`);
      if (hasRain) addItem('☂️', '#FFCDD2', '折疊雨傘 (必備)', '1 把');
      
      ul.innerHTML = html;
      updateProgressBar(true); // 初始化進度
    }

    // 更新進度條
    function updateProgressBar(reset = false) {
      const checkboxes = document.querySelectorAll('.packing-item input[type="checkbox"]');
      if (reset) checkboxes.forEach(cb => cb.checked = false);
      
      const checked = document.querySelectorAll('.packing-item input[type="checkbox"]:checked');
      const percentage = checkboxes.length ? Math.round((checked.length / checkboxes.length) * 100) : 0;
      
      document.getElementById('progress-text').innerText = `📦 裝箱進度：${percentage}%`;
      document.getElementById('packing-progress').style.width = `${percentage}%`;
      
      // 更新完成樣式
      checkboxes.forEach(cb => {
        if(cb.checked) cb.closest('.packing-item').classList.add('checked');
        else cb.closest('.packing-item').classList.remove('checked');
      });

      // 慶祝動畫
      document.getElementById('celebration').style.display = (percentage === 100 && checkboxes.length > 0) ? 'block' : 'none';
    }

    window.onload = initApp;
  </script>
